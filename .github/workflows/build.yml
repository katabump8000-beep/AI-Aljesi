name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform files if missing
        run: flutter create --platforms=android --project-name dark_gpt --org com.darkgpt .

      - name: Add dependencies
        run: |
          flutter pub add dio archive file_picker share_plus flutter_secure_storage shared_preferences path_provider uuid audioplayers llama_flutter_android

      - name: Android settings (internet permission, minSdk)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/' android/app/build.gradle* || true

      - run: flutter pub get

      - name: Analyze (errors are shown in the log)
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dark-gpt-apk
          path: build/app/outputs/flutter-apk/app-release.apk
